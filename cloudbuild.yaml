options:
  logging: CLOUD_LOGGING_ONLY
steps:
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'gcr.io/$PROJECT_ID/my-cloudrun-app:$SHORT_SHA', '.']

- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/$PROJECT_ID/my-cloudrun-app:$SHORT_SHA']

- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: 'bash'
  args:
    - -c
    - |
      gcloud run deploy my-cloudrun-app \
        --image=gcr.io/$PROJECT_ID/my-cloudrun-app:$SHORT_SHA \
        --region=asia-south1 \
        --platform=managed \
        --allow-unauthenticated

images:
- 'gcr.io/$PROJECT_ID/my-cloudrun-app:$SHORT_SHA'
