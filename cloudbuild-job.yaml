cat > cloudbuild-job.yaml <<'YAML'
steps:
- name: 'gcr.io/cloud-builders/docker'
  args:
    - 'build'
    - '-t'
    - '${_REGION}-docker.pkg.dev/$PROJECT_ID/job-repo/supabase-job:$SHORT_SHA'
    - '.'

- name: 'gcr.io/cloud-builders/docker'
  args:
    - 'push'
    - '${_REGION}-docker.pkg.dev/$PROJECT_ID/job-repo/supabase-job:$SHORT_SHA'

images:
- '${_REGION}-docker.pkg.dev/$PROJECT_ID/job-repo/supabase-job:$SHORT_SHA'
YAML

git add cloudbuild-job.yaml
git commit -m "cloudbuild: use ${_REGION} substitution for artifact registry"
git push origin main
