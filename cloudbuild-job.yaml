options:
  logging: CLOUD_LOGGING_ONLY

steps:
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/job-repo/supabase-job:$SHORT_SHA', '.']

- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'asia-south1-docker.pkg.dev/$PROJECT_ID/job-repo/supabase-job:$SHORT_SHA']

images:
- 'asia-south1-docker.pkg.dev/$PROJECT_ID/job-repo/supabase-job:$SHORT_SHA'
